<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { width: 320px; background: #f5f6fa; }

  .header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .header img { width: 28px; height: 28px; }
  .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .header .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }

  .search { padding: 10px 12px 4px; }
  .search input {
    width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0;
    border-radius: 8px; font-size: 13px; outline: none;
  }
  .search input:focus { border-color: #4f46e5; }

  .notes { max-height: 240px; overflow-y: auto; padding: 8px 12px; }
  .note {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .note:hover { border-color: #c7d2fe; }
  .note .title { font-size: 13px; font-weight: 600; color: #1e293b; }
  .note .preview { font-size: 11px; color: #64748b; margin-top: 2px; }
  .note .date { font-size: 10px; color: #94a3b8; margin-top: 4px; }
  .empty { text-align: center; color: #94a3b8; font-size: 12px; padding: 24px 0; }

  .composer { padding: 8px 12px; border-top: 1px solid #e2e8f0; background: #fff; }
  .composer textarea {
    width: 100%; height: 52px; padding: 8px; border: 1px solid #e2e8f0;
    border-radius: 8px; font-size: 13px; resize: none; outline: none;
  }
  .composer .actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 8px; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-secondary { background: #eef2ff; color: #4f46e5; }
  .btn-secondary:hover { background: #e0e7ff; }

  .footer {
    display: flex; justify-content: space-around; padding: 8px;
    border-top: 1px solid #e2e8f0; background: #fff;
  }
  .footer button {
    background: none; border: none; cursor: pointer;
    font-size: 11px; color: #64748b; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .footer button:hover { color: #4f46e5; }
  .footer .ico { font-size: 16px; }

  #toast {
    position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; font-size: 12px; padding: 6px 14px;
    border-radius: 20px; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="logo">
    <h1>Meeting Notes</h1>
    <div class="sync-dot" title="Synced"></div>
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="🔍 Search notes...">
  </div>

  <div class="notes" id="notesList">
    <div class="empty">No notes yet — write your first one below 👇</div>
  </div>

  <div class="composer">
    <textarea id="newNote" placeholder="Quick note from today's meeting..."></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">💾 Save Note</button>
      <button class="btn btn-secondary" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="footer">
    <button id="syncBtn"><span class="ico">🔄</span>Sync</button>
    <button id="exportBtn"><span class="ico">📤</span>Export</button>
    <button id="settingsBtn"><span class="ico">⚙️</span>Settings</button>
  </div>

  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
