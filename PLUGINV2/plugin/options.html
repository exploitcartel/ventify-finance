<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; background: #f5f6fa; width: 340px; }
  h2 { font-size: 15px; color: #1e293b; margin-bottom: 16px; }
  .setting { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .setting label { font-size: 13px; color: #334155; }
  .setting small { display: block; font-size: 11px; color: #94a3b8; margin-top: 2px; }
  select, input[type="text"] { padding: 6px 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; }
  .footer { font-size: 10px; color: #94a3b8; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
  <h2>⚙️ Meeting Notes — Settings</h2>

  <div class="setting">
    <div><label>Auto-sync</label><small>Sync notes to cloud every 15 min</small></div>
    <select id="autosync"><option value="on">On</option><option value="off">Off</option></select>
  </div>

  <div class="setting">
    <div><label>Theme</label><small>Appearance of the popup</small></div>
    <select id="theme"><option>Light</option><option>Dark</option><option>Auto</option></select>
  </div>

  <div class="setting">
    <div><label>Shortcut</label><small>Open popup with keyboard</small></div>
    <input type="text" value="Ctrl+Shift+M" disabled>
  </div>

  <div class="footer">Meeting Notes v1.2.1 · made with ☕</div>

  <script src="options.js"></script>
</body>
</html>
