<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ventify Finance | Reset Password</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand">
      <img src="img/logo.webp" alt="Ventify Finance" class="brand-logo brand-logo-lg" />
    </div>
    <p class="subtitle">Reset your password</p>

    <form id="forgot-form">
      <p class="forgot-copy">Enter the email address on your account and we'll send you a
        link to reset your password.</p>
      <label>Email</label>
      <input type="email" id="reset-email" autocomplete="email" required />
      <button type="submit">Send reset link</button>
    </form>

    <div id="forgot-sent" class="forgot-sent hidden">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>
      <p>If an account exists for that email, we've sent password reset
        instructions. Check your inbox (and spam folder).</p>
    </div>

    <p class="hint"><a href="login.html">&larr; Back to sign in</a></p>
  </div>
<script src="js/forgot-password.js"></script>
</body>
</html>
